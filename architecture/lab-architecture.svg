<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f2ff"/><stop offset="1" stop-color="#dceaff"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f8f1"/><stop offset="1" stop-color="#d9f1e7"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2edff"/><stop offset="1" stop-color="#e8e1ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#20344f" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5b718d"/></marker>
  <style>
    .heading{font:700 38px 'Segoe UI',Arial,sans-serif;fill:#152b45}
    .sub{font:400 20px 'Segoe UI',Arial,sans-serif;fill:#536a83}
    .card-title{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#18334f}
    .body{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#314961}
    .small{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#51677e}
    .tag{font:700 14px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#41607f}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="90" y="86" class="heading">Threat Hunting &amp; Incident Response Lab</text>
<text x="90" y="124" class="sub">Windows Security telemetry collection, SPL hunting and analyst-led investigation</text>

<!-- endpoint card -->
<rect x="75" y="230" rx="24" ry="24" width="335" height="360" fill="url(#blue)" stroke="#b9d3f5" stroke-width="2" filter="url(#shadow)"/>
<text x="112" y="282" class="tag">ENDPOINT</text>
<text x="112" y="326" class="card-title">Windows 10 VM</text>
<text x="112" y="370" class="body">DESKTOP-T0FDBKJ</text>
<rect x="112" y="406" rx="12" width="260" height="60" fill="#ffffff" fill-opacity=".82" stroke="#c6d9ee"/>
<text x="132" y="443" class="body">Windows Security Log</text>
<text x="112" y="508" class="small">Events: 4624 · 4625 · 4688 · 4740</text>
<text x="112" y="542" class="small">Controlled authentication and</text>
<text x="112" y="566" class="small">process-execution tests</text>

<!-- forwarder -->
<rect x="485" y="280" rx="24" ry="24" width="270" height="260" fill="url(#green)" stroke="#b6dfcc" stroke-width="2" filter="url(#shadow)"/>
<text x="520" y="332" class="tag">LOG COLLECTION</text>
<text x="520" y="379" class="card-title">Splunk Universal</text>
<text x="520" y="410" class="card-title">Forwarder</text>
<text x="520" y="461" class="body">WinEventLog://Security</text>
<text x="520" y="496" class="small">Forwards to TCP 9997</text>

<!-- splunk -->
<rect x="835" y="215" rx="24" ry="24" width="340" height="390" fill="#ffffff" stroke="#c8d4e2" stroke-width="2" filter="url(#shadow)"/>
<text x="875" y="270" class="tag">SIEM / SEARCH</text>
<text x="875" y="316" class="card-title">Splunk Enterprise</text>
<text x="875" y="350" class="body">Free license · main index</text>
<rect x="875" y="390" rx="12" width="260" height="66" fill="url(#blue)" stroke="#c2d7f0"/>
<text x="895" y="429" class="body">SPL hunting searches</text>
<rect x="875" y="472" rx="12" width="260" height="66" fill="url(#green)" stroke="#c2e3d3"/>
<text x="895" y="511" class="body">Event correlation</text>
<text x="875" y="570" class="small">Manual search and review</text>

<!-- analyst -->
<rect x="1250" y="280" rx="24" ry="24" width="280" height="260" fill="url(#violet)" stroke="#d0c4f3" stroke-width="2" filter="url(#shadow)"/>
<text x="1284" y="332" class="tag">SOC ANALYST</text>
<text x="1284" y="380" class="card-title">Investigate</text>
<text x="1284" y="422" class="body">Triage · Correlate</text>
<text x="1284" y="455" class="body">Preserve evidence</text>
<text x="1284" y="488" class="body">Assess · Document</text>

<!-- arrows -->
<path d="M410 410 H475" stroke="#5b718d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M755 410 H825" stroke="#5b718d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M1175 410 H1240" stroke="#5b718d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="423" y="386" class="small">Events</text>
<text x="765" y="386" class="small">TCP 9997</text>
<text x="1185" y="386" class="small">Findings</text>

<!-- cases band -->
<rect x="190" y="680" rx="18" width="1220" height="130" fill="#ffffff" stroke="#d8e1eb" stroke-width="2"/>
<text x="230" y="725" class="tag">INVESTIGATION OUTPUTS</text>
<rect x="230" y="748" rx="10" width="490" height="42" fill="#eaf2ff"/>
<text x="250" y="776" class="body">SOC-IR-001 · Hidden PowerShell simulation</text>
<rect x="880" y="748" rx="10" width="490" height="42" fill="#e8f7ef"/>
<text x="900" y="776" class="body">SOC-IR-002 · Repeated failed-logon simulation</text>
</svg>